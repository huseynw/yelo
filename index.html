<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YELO SHOP | Premium PUBG UC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #facc15; /* Yelo color */
            --primary-hover: #eab308;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .container {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 500px;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .payment-info {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px dashed var(--primary);
            padding: 1.5rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .payment-info h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card-number {
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .bank-name {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        select, input[type="text"], input[type="file"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        input[type="file"] {
            padding: 0.5rem;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            margin-right: 1rem;
            transition: background 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #475569;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* WhatsApp Button */
        .whatsapp-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            transition: transform 0.3s;
            z-index: 1000;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
        }

        /* Loading / Success message */
        #status-msg {
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }

    </style>
</head>
<body>

    <div class="header">
        <h1>YELO SHOP</h1>
        <p>Premium PUBG UC Mərkəzi</p>
    </div>

    <div class="container">
        <div class="payment-info">
            <h3><i class="fas fa-credit-card"></i> Ödəniş Məlumatları</h3>
            <div class="card-number" id="cardNumber">5411 2498 1204 7533</div>
            <div class="bank-name">Bank: <strong>UNIBANK</strong></div>
            <div style="margin-top: 10px; font-size: 0.9rem; color: #94a3b8;">Məbləği bu karta köçürdükdən sonra qəbzi aşağıdan yükləyin.</div>
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label for="ucPackage"><i class="fas fa-box-open"></i> UC Paketi Seçin</label>
                <select id="ucPackage" required>
                    <option value="" disabled selected>Paket seçin...</option>
                    <option value="60 UC - 2 AZN">60 UC - 2 AZN</option>
                    <option value="120 UC - 4 AZN">120 UC - 4 AZN</option>
                    <option value="180 UC - 5 AZN">180 UC - 5 AZN</option>
                    <option value="325 UC - 9 AZN">325 UC - 9 AZN</option>
                    <option value="385 UC - 11 AZN">385 UC - 11 AZN</option>
                    <option value="660 UC - 17 AZN">660 UC - 17 AZN</option>
                    <option value="720 UC - 19 AZN">720 UC - 19 AZN</option>
                    <option value="1045 UC - 26 AZN">1045 UC - 26 AZN</option>
                    <option value="1320 UC - 33 AZN">1320 UC - 33 AZN</option>
                    <option value="1800 UC - 39 AZN">1800 UC - 39 AZN</option>
                    <option value="1980 UC - 44 AZN">1980 UC - 44 AZN</option>
                    <option value="3850 UC - 79 AZN">3850 UC - 79 AZN</option>
                    <option value="8100 UC - 153 AZN">8100 UC - 153 AZN</option>
                </select>
            </div>

            <div class="form-group">
                <label for="playerId"><i class="fas fa-gamepad"></i> Oyuncu ID</label>
                <input type="text" id="playerId" placeholder="Məsələn: 5123456789" required>
            </div>

            <div class="form-group">
                <label for="receipt"><i class="fas fa-file-invoice-dollar"></i> Ödəniş Qəbzi (Şəkil)</label>
                <input type="file" id="receipt" accept="image/*" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Sifarişi Göndər</button>
            <div id="status-msg"></div>
        </form>
    </div>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/9945130854409" target="_blank" class="whatsapp-btn">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // DİQQƏT: Bu hissədə öz Bot Tokeninizi və Chat ID-nizi yazmalısınız
        const BOT_TOKEN = '8083741609:AAEnPt_Sa01wHAazKg--uXJH8cGIDdzaibA'; 
        const CHAT_ID = '6436992668';

        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('status-msg');
            const ucPackage = document.getElementById('ucPackage').value;
            const playerId = document.getElementById('playerId').value;
            const fileInput = document.getElementById('receipt');
            
            if (fileInput.files.length === 0) {
                alert("Zəhmət olmasa qəbzin şəklini yükləyin!");
                return;
            }

            // Button state change
            submitBtn.disabled = true;
            submitBtn.textContent = 'Göndərilir...';
            statusMsg.style.display = 'none';

            // Prepare Date
            const now = new Date();
            const dateStr = now.toLocaleDateString('az-AZ') + ' ' + now.toLocaleTimeString('az-AZ');

            // Construct Telegram message caption
            const caption = `🟡 *YELO SHOP - YENİ SİFARİŞ* 🟡\n\n🎮 *Oyuncu ID:* \`${playerId}\`\n📦 *Paket:* ${ucPackage}\n📅 *Tarix:* ${dateStr}`;

            // Prepare FormData for image upload
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', fileInput.files[0]);
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');

            try {
                // Send to Telegram API
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.ok) {
                    statusMsg.textContent = 'Sifarişiniz uğurla göndərildi! Gözləyin.';
                    statusMsg.className = 'success';
                    document.getElementById('orderForm').reset();
                } else {
                    statusMsg.textContent = 'Xəta baş verdi. Zəhmət olmasa WhatsApp ilə əlaqə saxlayın.';
                    statusMsg.className = 'error';
                    console.error('Telegram API Error:', result);
                }
            } catch (error) {
                statusMsg.textContent = 'Bağlantı xətası. Yenidən yoxlayın.';
                statusMsg.className = 'error';
                console.error('Network Error:', error);
            } finally {
                statusMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sifarişi Göndər';
            }
        });
    </script>
</body>
</html>
